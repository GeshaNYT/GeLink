<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Вход через GeLink</title>
<style>
    :root {
        --ge-primary: #0084ff;
        --ge-accent-gradient: linear-gradient(135deg, #0084ff 0%, #00c6ff 100%);
        --ge-error: #fa3e3e;
        --bg-body: #f0f2f5;
        --bg-panel: #ffffff;
        --bg-soft: #f0f2f5;
        --text: #050505;
        --text-muted: #65676b;
        --border: #e4e6eb;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg-body: #18191a;
            --bg-panel: #242526;
            --bg-soft: #3a3b3c;
            --text: #e4e6eb;
            --text-muted: #b0b3b8;
            --border: #3e4042;
        }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 16px; background: var(--bg-body); color: var(--text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .card {
        width: 100%; max-width: 400px; background: var(--bg-panel); border-radius: 20px;
        padding: 28px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center;
    }
    .logo {
        font-weight: 800; font-size: 22px; letter-spacing: -.5px;
        background: var(--ge-accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 18px 0 6px; line-height: 1.35; }
    .muted { color: var(--text-muted); font-size: 14px; line-height: 1.45; }
    .user {
        display: flex; align-items: center; gap: 12px; text-align: left;
        background: var(--bg-soft); border-radius: 14px; padding: 12px; margin: 20px 0 16px;
    }
    .avatar {
        width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; background: var(--ge-accent-gradient);
        background-size: cover; background-position: center;
        display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 18px;
    }
    .user-name { font-weight: 600; }
    .scopes { text-align: left; margin: 0 0 22px; padding: 0; list-style: none; }
    .scopes li { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .scopes li:last-child { border-bottom: 0; }
    .scopes li::before { content: '✓'; color: var(--ge-primary); font-weight: 700; margin-right: 10px; }
    .btn {
        display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px; font-size: 15px;
        font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn-primary { background: var(--ge-accent-gradient); color: #fff; }
    .btn-secondary { background: transparent; color: var(--text-muted); margin-top: 8px; }
    .btn:disabled { opacity: .6; cursor: default; }
    .error { color: var(--ge-error); }
    .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
    <div class="logo">GeLink</div>

    <div id="loading" class="muted" style="margin-top:20px">Загрузка…</div>

    <div id="error" class="hidden">
        <h1 class="error">Не удалось выполнить вход</h1>
        <p class="muted" id="error-text"></p>
    </div>

    <div id="need-login" class="hidden">
        <h1><span class="app-name"></span> хочет войти через ваш аккаунт GeLink</h1>
        <p class="muted">Чтобы продолжить, войдите в GeLink. После входа вы вернётесь сюда.</p>
        <button class="btn btn-primary" id="btn-login" style="margin-top:20px">Войти в GeLink</button>
        <button class="btn btn-secondary" id="btn-cancel-1">Отмена</button>
    </div>

    <div id="consent" class="hidden">
        <h1><span class="app-name"></span> запрашивает доступ к вашему аккаунту GeLink</h1>
        <div class="user">
            <div class="avatar" id="avatar"></div>
            <div>
                <div class="user-name" id="user-name"></div>
                <div class="muted" id="user-nick"></div>
            </div>
        </div>
        <ul class="scopes" id="scopes"></ul>
        <button class="btn btn-primary" id="btn-allow">Разрешить</button>
        <button class="btn btn-secondary" id="btn-cancel-2">Отмена</button>
        <p class="muted" style="font-size:12px;margin-top:14px">Пароль и переписка не передаются.</p>
    </div>
</div>

<script>
(function () {
    const q = new URLSearchParams(location.search);
    const params = {
        client_id: q.get('client_id') || '',
        redirect_uri: q.get('redirect_uri') || '',
        state: q.get('state') || '',
        scope: q.get('scope') || 'profile',
        code_challenge: q.get('code_challenge') || '',
        code_challenge_method: q.get('code_challenge_method') || '',
    };
    const $ = id => document.getElementById(id);
    const show = id => {
        ['loading', 'error', 'need-login', 'consent'].forEach(x => $(x).classList.toggle('hidden', x !== id));
    };
    const fail = msg => { $('error-text').textContent = msg; show('error'); };

    function readJSON(key) {
        try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; }
    }
    function storage(fn) { try { return fn(); } catch { return null; } }

    // redirect_uri уже проверен сервером — только тогда на него можно отправлять
    function backToApp(extra) {
        const url = new URL(params.redirect_uri);
        Object.entries(extra).forEach(([k, v]) => url.searchParams.set(k, v));
        if (params.state) url.searchParams.set('state', params.state);
        location.href = url.toString();
    }
    const cancel = () => backToApp({ error: 'access_denied' });

    function goLogin() {
        // Сессия без JWT (вход до обновления) — просим войти заново
        storage(() => localStorage.removeItem('ge_v9_token'));
        storage(() => localStorage.removeItem('ge_jwt'));
        storage(() => sessionStorage.setItem('ge_oauth_return', location.pathname + location.search));
        location.href = '/';
    }

    async function start() {
        if (q.get('response_type') !== 'code') return fail('Неверный запрос: response_type должен быть code.');
        if (!params.client_id || !params.redirect_uri) return fail('Неверный запрос: нет client_id или redirect_uri.');

        let info;
        try {
            const res = await fetch(`/api/index?action=oauthClientInfo&client_id=${encodeURIComponent(params.client_id)}&redirect_uri=${encodeURIComponent(params.redirect_uri)}`);
            info = await res.json();
        } catch { return fail('Ошибка соединения с сервером.'); }
        if (info.status !== 'ok') return fail(info.message || 'Приложение не зарегистрировано.');

        document.querySelectorAll('.app-name').forEach(el => el.textContent = info.name);

        const session = readJSON('ge_v9_token');
        const jwt = storage(() => localStorage.getItem('ge_jwt'));
        if (!session || !session.email || !jwt) return show('need-login');

        $('user-name').textContent = session.name || session.email;
        $('user-nick').textContent = session.nickname ? '@' + session.nickname : session.email;
        const av = $('avatar');
        if (session.avImg) {
            av.style.backgroundImage = `url("${String(session.avImg).replace(/"/g, '%22')}")`;
        } else {
            if (session.avColor) av.style.background = session.avColor;
            av.textContent = (session.name || session.email || '?').trim().charAt(0).toUpperCase();
        }

        const scopes = params.scope.split(/\s+/);
        const items = ['Имя, никнейм, аватар и «о себе»'];
        if (scopes.includes('email')) items.push('Адрес электронной почты');
        $('scopes').replaceChildren(...items.map(t => { const li = document.createElement('li'); li.textContent = t; return li; }));

        show('consent');
    }

    $('btn-login').onclick = goLogin;
    $('btn-cancel-1').onclick = cancel;
    $('btn-cancel-2').onclick = cancel;

    $('btn-allow').onclick = async () => {
        const btn = $('btn-allow');
        btn.disabled = true; btn.textContent = 'Подождите…';
        try {
            const res = await fetch('/api/index?action=oauthApprove', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: 'Bearer ' + (storage(() => localStorage.getItem('ge_jwt')) || ''),
                },
                body: JSON.stringify(params),
            });
            const data = await res.json();
            if (res.status === 401) return show('need-login');
            if (data.status !== 'ok') { btn.disabled = false; btn.textContent = 'Разрешить'; return fail(data.message || 'Ошибка'); }
            location.href = data.redirect;
        } catch {
            btn.disabled = false; btn.textContent = 'Разрешить';
            fail('Ошибка соединения с сервером.');
        }
    };

    start();
})();
</script>
</body>
</html>
